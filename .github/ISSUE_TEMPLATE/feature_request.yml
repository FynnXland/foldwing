name: Feature request
description: Suggest an idea or an improvement for Foldwing.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. You can write in English or German (*Deutsch ist genauso willkommen*).
        Please describe the problem first: a good description of what gets in your way is often more useful than a finished solution.

        Foldwing keeps file contents on your PC; the relay only passes pages through. Ideas that would send file contents to other services (cloud OCR, AI, online viewers) or change the downloaded file won't be built.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: "When I share …, I always have to …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could Foldwing help? Settings, buttons or shortcuts you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What have you tried, or how do other tools solve it?

  - type: dropdown
    id: who
    attributes:
      label: Who would use it?
      multiple: true
      options:
        - Me, sharing files
        - My recipients, in the browser
        - Someone running their own relay

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My examples contain no real file names, links, domains or other personal data. Issues are public.
          required: true
